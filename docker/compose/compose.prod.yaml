# Production Docker Compose for fides.website.
#
# Lives on the VPS at /srv/fides/current/docker/compose/compose.prod.yaml
# (the symlinked release directory). Bring up with:
#
#   APP_IMAGE_TAG=sha-<sha7> docker compose \
#     -f /srv/fides/current/docker/compose/compose.prod.yaml up -d
#
# Requires:
#   * An external Docker network named `edge` (created once by the TLS
#     reverse-proxy stack, e.g. Caddy).
#   * /srv/fides/shared/.env       (production env, chmod 640)
#   * /srv/fides/shared/database/database.sqlite (host UID 1000)
#   * /srv/fides/shared/storage    (host UID 1000)
name: fides

services:
  app:
    image: ghcr.io/studio-guez/fides.website:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - /srv/fides/shared/.env
    volumes:
      - /srv/fides/shared/database/database.sqlite:/var/www/html/database/database.sqlite
      - /srv/fides/shared/storage:/var/www/html/storage
      # Shared with nginx so static assets (incl. /build, /vendor/statamic) are served.
      # Docker seeds this named volume from THIS container's image on first start,
      # which is why the mount must live on `app` (the app image), not on `nginx`.
      - app-public:/var/www/html/public
      # The entrypoint overlays content/**/* config YAMLs from the image on each
      # start, so collection/global/locale additions never require compose changes.
      - /srv/fides/shared/content:/var/www/html/content
      - /srv/fides/shared/users:/var/www/html/users
    networks:
      - internal
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - /srv/fides/current/docker/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the public/ tree seeded by the `app` service above.
      - app-public:/var/www/html/public:ro
    networks:
      - internal
      - edge
    labels:
      # Auto-discovered by caddy-docker-proxy in the separate `edge` stack.
      caddy: ${APP_DOMAIN:-example.com}
      caddy.reverse_proxy: "{{upstreams 80}}"

volumes:
  app-public:

networks:
  internal:
    driver: bridge
  edge:
    external: true
