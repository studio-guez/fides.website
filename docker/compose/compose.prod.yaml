# Production Docker Compose for fides.website.
#
# Lives on a target server at $DEPLOY_PATH/current/docker/compose/compose.prod.yaml
# (the symlinked release directory). Bring up with:
#
#   APP_IMAGE_TAG=<tag> docker compose \
#     -f $DEPLOY_PATH/current/docker/compose/compose.prod.yaml up -d
#
# This stack contains ONLY the application:
#   * `app`   — php-fpm (the Statamic/Laravel app)
#   * `nginx` — the app-level web server in front of php-fpm
#
# TLS termination and host-based routing are handled by a reverse proxy that
# runs OUTSIDE this project, directly on the target server (e.g. system nginx,
# Caddy, or Traefik installed on the host). That external reverse proxy is
# expected to forward HTTP traffic to the port published below
# (default: 127.0.0.1:${APP_HTTP_PORT:-8080}).
#
# Requires on the target server:
#   * $DEPLOY_PATH/shared/.env                       (chmod 640)
#   * $DEPLOY_PATH/shared/database/database.sqlite   (host UID 1000)
#   * $DEPLOY_PATH/shared/storage                    (host UID 1000)
#   * $DEPLOY_PATH/shared/content                    (host UID 1000)
#   * $DEPLOY_PATH/shared/users                      (host UID 1000, Mode B only — see compose file)
#   * A reverse proxy on the host forwarding the public domain to
#     127.0.0.1:${APP_HTTP_PORT:-8080}
name: fides

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/studio-guez/fides.website}:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${SHARED_PATH:-/srv/fides/shared}/.env
    volumes:
      - ${SHARED_PATH:-/srv/fides/shared}/database/database.sqlite:/var/www/html/database/database.sqlite
      - ${SHARED_PATH:-/srv/fides/shared}/storage:/var/www/html/storage
      # Shared with nginx so static assets (incl. /build, /vendor/statamic) are served.
      # Docker seeds this named volume from THIS container's image on first start,
      # which is why the mount must live on `app` (the app image), not on `nginx`.
      - app-public:/var/www/html/public
      # The entrypoint overlays content/**/* config YAMLs from the image on each
      # start, so collection/global/locale additions never require compose changes.
      - ${SHARED_PATH:-/srv/fides/shared}/content:/var/www/html/content
      # Optional host overrides for public/ files (e.g. robots.txt).
      # Files placed here shadow the git-tracked defaults baked into the image.
      # The deploy workflow seeds this directory automatically on first deploy.
      - ${SHARED_PATH:-/srv/fides/shared}/public:/var/www/html/.shared-public:ro
      # Mode B: uncomment to persist users/ on-host (outside the image).
      # Requires $SHARED_PATH/users to exist with UID 1000 before starting.
      # - ${SHARED_PATH:-/srv/fides/shared}/users:/var/www/html/users
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ../prod/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the public/ tree seeded by the `app` service above.
      - app-public:/var/www/html/public:ro
      # Storage must be mounted here too so nginx can serve files via the
      # public/storage symlink (public/storage -> ../storage/app/public).
      - ${SHARED_PATH:-/srv/fides/shared}/storage:/var/www/html/storage:ro
    # The host-level reverse proxy (out of scope for this repo) should forward
    # public HTTPS traffic to this port on the loopback interface.
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    networks:
      - internal

volumes:
  app-public:

networks:
  internal:
    driver: bridge
