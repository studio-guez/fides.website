name: Remote deploy
description: |
  SSHes into a target server, uploads the compose bundle, pulls the new
  application image from GHCR, runs migrations, and brings the app stack up.
  Environment-specific values (host, path, ssh key, GHCR pull token) are
  passed in as inputs so the same action can be reused by the preprod and
  production deploy jobs without leaking secrets between environments.

inputs:
  ssh_host:
    required: true
  ssh_user:
    required: true
  ssh_port:
    required: false
    default: '22'
  ssh_private_key:
    required: true
  deploy_path:
    description: Base deployment path on the remote server (e.g. /srv/fides)
    required: true
  ghcr_user:
    required: true
  ghcr_token:
    required: true
  image_tag:
    required: true
  release_id:
    required: true
  bundle_path:
    description: Local path to the compose bundle tgz already downloaded.
    required: true

runs:
  using: composite
  steps:
    - name: Setup SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

    - name: Upload compose bundle
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        SSH_PORT: ${{ inputs.ssh_port }}
        RELEASE_ID: ${{ inputs.release_id }}
        BUNDLE_PATH: ${{ inputs.bundle_path }}
      run: |
        scp -P "${SSH_PORT:-22}" "$BUNDLE_PATH" \
          "$SSH_USER@$SSH_HOST:/tmp/compose-$RELEASE_ID.tgz"

    - name: Execute remote deploy
      shell: bash
      env:
        SSH_HOST:    ${{ inputs.ssh_host }}
        SSH_USER:    ${{ inputs.ssh_user }}
        SSH_PORT:    ${{ inputs.ssh_port }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
        GHCR_USER:   ${{ inputs.ghcr_user }}
        GHCR_TOKEN:  ${{ inputs.ghcr_token }}
        IMAGE_TAG:   ${{ inputs.image_tag }}
        RELEASE_ID:  ${{ inputs.release_id }}
        REPO:        ${{ github.repository }}
      run: |
        IMAGE_REF="ghcr.io/${REPO}:${IMAGE_TAG}"
        ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
          "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='$RELEASE_ID' \
           IMAGE_TAG='$IMAGE_TAG' IMAGE_REF='$IMAGE_REF' \
           GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' \
           bash -s" <<'REMOTE'
        set -euo pipefail

        RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
        SHARED_DIR="$DEPLOY_PATH/shared"
        CURRENT="$DEPLOY_PATH/current"

        mkdir -p "$RELEASE_DIR" "$SHARED_DIR/backups" "$SHARED_DIR/database" "$SHARED_DIR/storage"
        tar -xzf "/tmp/compose-$RELEASE_ID.tgz" -C "$RELEASE_DIR"
        rm -f "/tmp/compose-$RELEASE_ID.tgz"

        # Login to GHCR (idempotent)
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

        # Pre-flight DB backup (online-safe)
        TS=$(date -u +%Y%m%dT%H%M%SZ)
        if [ -f "$SHARED_DIR/database/database.sqlite" ]; then
          sqlite3 "$SHARED_DIR/database/database.sqlite" \
            ".backup '$SHARED_DIR/backups/db-$TS.sqlite'"
          ls -1t "$SHARED_DIR/backups"/db-*.sqlite | tail -n +31 | xargs -r rm --
        fi

        # Pull new image
        docker pull "$IMAGE_REF"

        # Record previous tag for one-line rollback
        if [ -f "$SHARED_DIR/current-tag.txt" ]; then
          cp "$SHARED_DIR/current-tag.txt" "$SHARED_DIR/last-tag.txt"
        fi
        echo "$IMAGE_TAG" > "$SHARED_DIR/current-tag.txt"

        # Run migrations BEFORE swapping containers.
        docker run --rm \
          --env-file "$SHARED_DIR/.env" \
          --entrypoint php \
          -v "$SHARED_DIR/database/database.sqlite:/var/www/html/database/database.sqlite" \
          -v "$SHARED_DIR/storage:/var/www/html/storage" \
          "$IMAGE_REF" \
          artisan migrate --force

        # Flip the `current` symlink atomically
        ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current.tmp"
        mv -Tf "$DEPLOY_PATH/current.tmp" "$CURRENT"

        # Force-rebuild the shared nginx public volume from the new image
        docker volume rm fides_app-public 2>/dev/null || true

        # Bring up the stack with the new image tag.
        # DEPLOY_PATH and SHARED_PATH let the compose file resolve absolute
        # paths without hardcoding a specific deploy root.
        APP_IMAGE_TAG="$IMAGE_TAG" \
        DEPLOY_PATH="$DEPLOY_PATH" \
        SHARED_PATH="$SHARED_DIR" \
        docker compose \
          -f "$CURRENT/docker/compose/compose.prod.yaml" \
          up -d --remove-orphans

        # Post-boot cache warm (entrypoint also runs these; this is explicit verification)
        docker compose -f "$CURRENT/docker/compose/compose.prod.yaml" exec -T app sh -c "
          php artisan config:cache && \
          php artisan route:cache && \
          php artisan view:cache && \
          php artisan event:cache && \
          php artisan statamic:stache:warm
        "

        # Prune
        docker image prune -f --filter "until=168h"
        ls -1dt "$DEPLOY_PATH/releases"/* | tail -n +6 | xargs -r rm -rf
        REMOTE
