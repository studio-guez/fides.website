name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    name: Build & push production image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release identifiers
        id: meta
        run: |
          SHA7=${GITHUB_SHA::7}
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "image_tag=sha-$SHA7" >> "$GITHUB_OUTPUT"
          echo "release_id=$TS-$SHA7" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private Composer auth (optional)
        if: ${{ env.COMPOSER_AUTH_JSON != '' }}
        env:
          COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH }}
        run: printf '%s' "$COMPOSER_AUTH_JSON" > ./auth.json

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WWWUSER=1000
            WWWGROUP=1000

      - name: Package compose bundle
        run: tar -czf compose-bundle.tgz docker/compose docker/prod

      - uses: actions/upload-artifact@v4
        with:
          name: compose-${{ steps.meta.outputs.release_id }}
          path: compose-bundle.tgz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
      RELEASE_ID: ${{ needs.build-image.outputs.release_id }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      GHCR_USER: ${{ secrets.GHCR_PULL_USER || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compose-${{ needs.build-image.outputs.release_id }}
          path: /tmp

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Compute image reference
        run: |
          SHA7=${GITHUB_SHA::7}
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY}:sha-${SHA7}" >> "$GITHUB_ENV"

      - name: Upload compose bundle
        run: |
          scp -P "${SSH_PORT:-22}" /tmp/compose-bundle.tgz \
            "$SSH_USER@$SSH_HOST:/tmp/compose-$RELEASE_ID.tgz"

      - name: Execute remote deploy
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='$RELEASE_ID' \
             IMAGE_TAG='$IMAGE_TAG' IMAGE_REF='$IMAGE_REF' \
             GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
          SHARED_DIR="$DEPLOY_PATH/shared"
          CURRENT="$DEPLOY_PATH/current"

          mkdir -p "$RELEASE_DIR" "$SHARED_DIR/backups" "$SHARED_DIR/database" "$SHARED_DIR/storage"
          tar -xzf "/tmp/compose-$RELEASE_ID.tgz" -C "$RELEASE_DIR"
          rm -f "/tmp/compose-$RELEASE_ID.tgz"

          # Login to GHCR (idempotent)
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # Pre-flight DB backup (online-safe)
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -f "$SHARED_DIR/database/database.sqlite" ]; then
            sqlite3 "$SHARED_DIR/database/database.sqlite" \
              ".backup '$SHARED_DIR/backups/db-$TS.sqlite'"
            ls -1t "$SHARED_DIR/backups"/db-*.sqlite | tail -n +31 | xargs -r rm --
          fi

          # Pull new image
          docker pull "$IMAGE_REF"

          # Record previous tag for one-line rollback
          if [ -f "$SHARED_DIR/current-tag.txt" ]; then
            cp "$SHARED_DIR/current-tag.txt" "$SHARED_DIR/last-tag.txt"
          fi
          echo "$IMAGE_TAG" > "$SHARED_DIR/current-tag.txt"

          # Run migrations BEFORE swapping containers
          docker run --rm \
            --env-file "$SHARED_DIR/.env" \
            -e RUN_MIGRATIONS=true \
            -v "$SHARED_DIR/database/database.sqlite:/var/www/html/database/database.sqlite" \
            -v "$SHARED_DIR/storage:/var/www/html/storage" \
            "$IMAGE_REF" \
            php artisan migrate --force

          # Flip the `current` symlink atomically
          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current.tmp"
          mv -Tf "$DEPLOY_PATH/current.tmp" "$CURRENT"

          # Force-rebuild the shared nginx public volume from the new image
          docker volume rm fides_app-public 2>/dev/null || true

          # Bring up the stack with the new image tag
          APP_IMAGE_TAG="$IMAGE_TAG" docker compose \
            -f "$CURRENT/docker/compose/compose.prod.yaml" \
            up -d --remove-orphans

          # Post-boot cache warm (entrypoint also runs these; this is explicit verification)
          docker compose -f "$CURRENT/docker/compose/compose.prod.yaml" exec -T app sh -c "
            php artisan config:cache && \
            php artisan route:cache && \
            php artisan view:cache && \
            php artisan event:cache && \
            php artisan statamic:stache:warm
          "

          # Prune
          docker image prune -f --filter "until=168h"
          ls -1dt "$DEPLOY_PATH/releases"/* | tail -n +6 | xargs -r rm -rf
          REMOTE
