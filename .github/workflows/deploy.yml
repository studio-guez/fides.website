name: Deploy

on:
  push:
    branches: [main, preprod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: preprod
        type: choice
        options: [preprod, production]

permissions:
  contents: read
  packages: write

concurrency:
  # One deploy at a time per environment (preprod vs production).
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Single build job, shared by both environments. The image we build is
  # environment-agnostic: app source + built frontend assets + Composer prod
  # deps. Environment-specific values come from each server's shared `.env`.
  # ---------------------------------------------------------------------------
  build-image:
    name: Build & push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      target: ${{ steps.meta.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment target and tags
        id: meta
        run: |
          SHA7=${GITHUB_SHA::7}
          TS=$(date -u +%Y%m%dT%H%M%SZ)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${GITHUB_REF}" = "refs/heads/preprod" ]; then
            TARGET="preprod"
          else
            # refs/heads/main or refs/tags/v*
            TARGET="production"
          fi

          if [ "$TARGET" = "preprod" ]; then
            IMAGE_TAG="preprod-sha-$SHA7"
            FLOATING_TAG="preprod"
          else
            IMAGE_TAG="sha-$SHA7"
            FLOATING_TAG="latest"
          fi

          echo "target=$TARGET"             >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"       >> "$GITHUB_OUTPUT"
          echo "floating_tag=$FLOATING_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$TS-$SHA7"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private Composer auth (optional)
        if: ${{ secrets.COMPOSER_AUTH != '' }}
        env:
          COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH }}
        run: printf '%s' "$COMPOSER_AUTH_JSON" > ./auth.json

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WWWUSER=1000
            WWWGROUP=1000

      - name: Package compose bundle
        run: tar -czf compose-bundle.tgz docker/compose docker/prod

      - uses: actions/upload-artifact@v4
        with:
          name: compose-${{ steps.meta.outputs.release_id }}
          path: compose-bundle.tgz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Preprod deploy. Only runs for the `preprod` branch (or workflow_dispatch
  # with target=preprod). Uses ONLY secrets scoped to the `preprod` GitHub
  # Environment.
  # ---------------------------------------------------------------------------
  deploy-preprod:
    name: Deploy to preproduction
    needs: build-image
    if: needs.build-image.outputs.target == 'preprod'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          name: compose-${{ needs.build-image.outputs.release_id }}
          path: /tmp

      - name: Remote deploy (preprod)
        uses: ./.github/actions/remote-deploy
        with:
          ssh_host:        ${{ secrets.SSH_HOST }}
          ssh_user:        ${{ secrets.SSH_USER }}
          ssh_port:        ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path:     ${{ secrets.DEPLOY_PATH }}
          ghcr_user:       ${{ secrets.GHCR_PULL_USER || github.actor }}
          ghcr_token:      ${{ secrets.GHCR_PULL_TOKEN }}
          image_tag:       ${{ needs.build-image.outputs.image_tag }}
          release_id:      ${{ needs.build-image.outputs.release_id }}
          bundle_path:     /tmp/compose-bundle.tgz

  # ---------------------------------------------------------------------------
  # Production deploy. Only runs for `main` / `v*` tag (or workflow_dispatch
  # with target=production). Uses ONLY secrets scoped to the `production`
  # GitHub Environment.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs: build-image
    if: needs.build-image.outputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          name: compose-${{ needs.build-image.outputs.release_id }}
          path: /tmp

      - name: Remote deploy (production)
        uses: ./.github/actions/remote-deploy
        with:
          ssh_host:        ${{ secrets.SSH_HOST }}
          ssh_user:        ${{ secrets.SSH_USER }}
          ssh_port:        ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_path:     ${{ secrets.DEPLOY_PATH }}
          ghcr_user:       ${{ secrets.GHCR_PULL_USER || github.actor }}
          ghcr_token:      ${{ secrets.GHCR_PULL_TOKEN }}
          image_tag:       ${{ needs.build-image.outputs.image_tag }}
          release_id:      ${{ needs.build-image.outputs.release_id }}
          bundle_path:     /tmp/compose-bundle.tgz
