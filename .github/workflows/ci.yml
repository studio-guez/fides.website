name: CI / Deploy

on:
  push:
    branches: [main, preprod]
    tags: ['v*']
  pull_request:
    branches: [main, preprod]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: preprod
        type: choice
        options: [preprod, production]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint, build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Lint (Pint, dry-run)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  # ---------------------------------------------------------------------------
  # Single build job, shared by both environments. Skipped on pull requests.
  # ---------------------------------------------------------------------------
  build-image:
    name: Build & push image
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
      target: ${{ steps.meta.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment target and tags
        id: meta
        run: |
          SHA7=${GITHUB_SHA::7}
          TS=$(date -u +%Y%m%dT%H%M%SZ)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${GITHUB_REF}" = "refs/heads/preprod" ]; then
            TARGET="preprod"
          else
            TARGET="production"
          fi

          if [ "$TARGET" = "preprod" ]; then
            IMAGE_TAG="preprod-sha-$SHA7"
            FLOATING_TAG="preprod"
          else
            IMAGE_TAG="sha-$SHA7"
            FLOATING_TAG="latest"
          fi

          echo "target=$TARGET"             >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"       >> "$GITHUB_OUTPUT"
          echo "floating_tag=$FLOATING_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$TS-$SHA7"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private Composer auth (optional)
        env:
          COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -n "$COMPOSER_AUTH_JSON" ]; then
            printf '%s' "$COMPOSER_AUTH_JSON" > ./auth.json
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WWWUSER=33
            WWWGROUP=33

      - name: Package compose bundle
        run: tar -czf compose-bundle.tgz docker/compose docker/prod

      - uses: actions/upload-artifact@v4
        with:
          name: compose-${{ steps.meta.outputs.release_id }}
          path: compose-bundle.tgz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Preprod deploy.
  # ---------------------------------------------------------------------------
  deploy-preprod:
    name: Deploy to preproduction
    needs: build-image
    if: needs.build-image.outputs.target == 'preprod'
    runs-on: [self-hosted, fides, docker]
    timeout-minutes: 15
    environment: preprod
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          name: compose-${{ needs.build-image.outputs.release_id }}
          path: /tmp

      - name: Deploy preprod to CI staging
        env:
          DEPLOY_PATH: /data/docker/instances/staging.fondationfides-ci.ch
          COMPOSE_PROJECT_NAME: fides-ci
          GHCR_USER: ${{ secrets.GHCR_PULL_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
          RELEASE_ID: ${{ needs.build-image.outputs.release_id }}
          REPO: ${{ github.repository }}
          BUNDLE_PATH: /tmp/compose-bundle.tgz
        run: |
          set -euo pipefail

          IMAGE_REF="ghcr.io/${REPO}:${IMAGE_TAG}"
          RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
          SHARED_DIR="$DEPLOY_PATH/shared"
          CURRENT="$DEPLOY_PATH/current"

          mkdir -p "$RELEASE_DIR" "$SHARED_DIR/backups" "$SHARED_DIR/database" "$SHARED_DIR/storage"
          tar -xzf "$BUNDLE_PATH" -C "$RELEASE_DIR"

          echo "Release prepared:"
          ls -la "$RELEASE_DIR"
          docker pull "$IMAGE_REF"

  # ---------------------------------------------------------------------------
  # Production deploy.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs: build-image
    if: needs.build-image.outputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          name: compose-${{ needs.build-image.outputs.release_id }}
          path: /tmp

      - name: Remote deploy (production)
        uses: ./.github/actions/remote-deploy
        with:
          ssh_host:         ${{ secrets.SSH_HOST }}
          ssh_user:         ${{ secrets.SSH_USER }}
          ssh_port:         ${{ secrets.SSH_PORT }}
          ssh_private_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_known_hosts:  ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy_path:      ${{ secrets.DEPLOY_PATH }}
          ghcr_user:        ${{ secrets.GHCR_PULL_USER || github.actor }}
          ghcr_token:       ${{ secrets.GHCR_PULL_TOKEN }}
          image_tag:        ${{ needs.build-image.outputs.image_tag }}
          release_id:       ${{ needs.build-image.outputs.release_id }}
          bundle_path:      /tmp/compose-bundle.tgz

