  history:
    display: Histoire
    sections:
      -
        fields:
          -
            handle: history_title
            field:
              type: text
              display: Titre
              validate:
                - required
          -
            handle: history_dates
            field:
              type: replicator
              display: Dates
              validate:
                - required
              sets:
                dates:
                  display: Dates
                  sets:
                    date:
                      display: Date
                      fields:
                        -
                          handle: year
                          field:
                            type: integer
                            display: Année
                            min: 1800
                            max: 3000
                            validate:
                              - required
                        -
                          handle: title
                          field:
                            type: text
                            display: Titre
                        -
                          handle: point_1
                          field:
                            buttons:
                              - bold
                              - italic
                              - anchor
                              - underline
                              - strikethrough
                              - superscript
                              - subscript
                              - unorderedlist
                              - orderedlist
                            smart_typography: true
                            link_noopener: true
                            link_noreferrer: true
                            target_blank: true
                            save_html: true
                            remove_empty_nodes: trim
                            type: bard
                            display: 'Point 1'
                        -
                          handle: point_2
                          field:
                            buttons:
                              - bold
                              - italic
                              - anchor
                              - underline
                              - strikethrough
                              - superscript
                              - subscript
                              - unorderedlist
                              - orderedlist
                            smart_typography: true
                            link_noopener: true
                            link_noreferrer: true
                            target_blank: true
                            save_html: true
                            remove_empty_nodes: trim
                            type: bard
                            display: 'Point 2'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
      -
        display: SEO
        fields:
          -
            import: seo_base
