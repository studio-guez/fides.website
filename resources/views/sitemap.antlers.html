<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection:pages }}
    <url>
        <loc>{{ permalink }}</loc>
        {{ if updated_at }}
        <lastmod>{{ updated_at format="Y-m-d" }}</lastmod>
        {{ /if }}
        <changefreq>weekly</changefreq>
        <priority>{{ if is_homepage }}1.0{{ else }}0.8{{ /if }}</priority>
    </url>
{{ /collection:pages }}
</urlset>
